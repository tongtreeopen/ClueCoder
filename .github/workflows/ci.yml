name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Offline demo
        run: python -m cluecoder --demo

      - name: Compile
        run: python -m compileall -q cluecoder tests

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Build
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*

      - name: Installed wheel smoke check without pytest
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -I -c "import cluecoder, importlib.util; assert importlib.util.find_spec('corecoder') is None; assert importlib.util.find_spec('pytest') is None; print(cluecoder.__version__)"
          cd "${{ runner.temp }}"
          "$GITHUB_WORKSPACE/.wheel-smoke/bin/cluecoder" --demo

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Fetch pinned sandbox image
        run: |
          IMAGE=$(python -c "from cluecoder.execution import DEFAULT_IMAGE; print(DEFAULT_IMAGE)")
          docker info --format '{{.OSType}}'
          docker pull "$IMAGE"
          docker image inspect "$IMAGE"
      - name: Docker execution and independent Gate checks
        run: python -m pytest tests/test_docker_execution.py tests/test_background_tasks.py tests/test_eval_cases.py tests/test_eval_fixtures.py tests/test_eval_holdout.py tests/test_eval_runner.py -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check cluecoder tests
