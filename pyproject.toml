[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracecoder"
version = "0.1.0"
description = "Python coding agent with traceable execution, recoverable state, and evidence-based verification."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Original upstream author retained for attribution.
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
maintainers = [{ name = "Tong ShuKai", email = "tongshukai@gmail.com" }]
keywords = ["ai", "agent", "coding", "cli", "llm", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/tongtreeopen/TraceCoder"
Issues = "https://github.com/tongtreeopen/TraceCoder/issues"

[tool.hatch.build.targets.wheel]
packages = ["tracecoder"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
tracecoder = "tracecoder.cli:main"


[tool.ruff]
line-length = 130
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
